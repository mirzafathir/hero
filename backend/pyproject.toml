[project]
name = "hero"
version = "0.1.0"
description = "HERO — Harmonisasi & Analisa Regulasi Otomatis (baseline: scraping, ingest, OCR & analysis)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "python-dateutil>=2.9",
    "tenacity>=8.2",
    "numpy>=1.26",
    "pikepdf>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hero = "hero.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hero*"]
